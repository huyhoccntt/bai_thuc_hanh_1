<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <h3>Bài tập 4: Xem trước ảnh đại diện (Image Preview)</h3>
    <div style="margin-bottom: 10px;">
      <label for="img-url" style="display: block; font-weight: 500;">Dán đường dẫn (URL) ảnh vào đây:</label>
      <input type="text" id="img-url" placeholder="https://example.com/image.jpg">
    </div>
    <img id="preview" class="img-preview" src="https://via.placeholder.com/150?text=No+Image" alt="Preview">
    </div>
</body>
</html>
