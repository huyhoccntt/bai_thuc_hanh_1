<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <link rel="stylesheet" href="slytle.css">
    <style>
        content-box {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        .container {
            background-color: #1e3a8a; 
            width: 80%;
            min-height: 100vh;      
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;          
            gap: 20px;
            padding: 20px;           
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .logo {
            width: 100px;
            height: 100px;
            background-color: #333;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .nav {
            width: 200px;
            height: 100px;            
            background-color: #2e7d32; 
            border-radius: 12px;
            flex-shrink: 0;
        }

        .item {
            height: 100px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #111;
            flex-shrink: 0;
        }

        .item1 {
            flex: 2;
            background-color: #7dd3fc; 
        }

        .item2 {
            flex: 3;
            background-color: #86efac; 
        }

        .content {
            flex: 2;
            height: 200px;            
            background-color: #fef08a; 
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #333;
        }

        .sidebar {
            flex: 4;
            height: 200px;
            background-color: #d1d5db; 
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #1f2937;
        }

        .body {
            flex: 5;
            height: 200px;
            background-color: #9ca3af; 
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #111827;
        }

        .row-2 {
            display: flex;
            flex: 1 1 100%;           
            gap: 20px;
            flex-wrap: wrap;
        }

        .container > * {
            flex: 1 1 auto;         
        }

        @media (max-width: 700px) {
            .container {
                width: 95%;
                gap: 15px;
            }
            .nav {
                width: 100%;          
                height: 60px;
            }
            .logo {
                width: 80px;
                height: 80px;
            }
            .item1, .item2 {
                flex: 1 1 100%;
            }
            .row-2 > * {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">Item 1</div>
        <div class="item item2">Item 2</div>
        <div class="logo"></div>
        <div class="nav"></div>

        <div class="row-2">
            <div class="content">Content</div>
            <div class="sidebar">Sidebar</div>
            <div class="body">Body</div>
        </div>
    </div>
</body>
</html>
