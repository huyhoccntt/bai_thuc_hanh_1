<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flexbox Layout</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="page">
		<header class="header">
			<span>Logo</span>
			<span>Navigation</span>
		</header>

		<section class="layout" aria-label="Layout example">
			<aside class="side-label">Background</aside>

			<div class="content">
				<div class="tiles" aria-label="Grid tiles">
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
                    <div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>
					<div class="tile"></div>

				</div>

				<div class="boxes">
					<div class="box">Box 1</div>
					<div class="box">Box 2</div>
					<div class="box">Box 3</div>
				</div>
			</div>

			<aside class="side-label">Background</aside>
		</section>

		<footer class="footer">Footer</footer>
	</main>
</body>
</html>
